<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簡報製作流程圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #f6f8fa; color: #17212b; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; padding: 32px 16px; }
main { max-width: 1008px; margin: 0 auto; }
h1 { font-size: 28px; line-height: 1.3; font-weight: 700; padding: 0 40px; }
.diagram-container { width: 100%; overflow-x: auto; }
svg { width: 100%; min-width: 1008px; display: block; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
@media print {
  .diagram-container { overflow-x: visible; }
  svg { min-width: 0; }
}
</style>
</head>
<body>
<main>
  <h1>從 LLM Wiki 到教學簡報的流程</h1>

      <desc id="workflow-diagram-desc">使用者、AI 和程式分工的八關流程，內容、忠實度和版面的問題各自退回不同關卡，使用者最後確認才公開。</desc>
      <defs>

      </defs>
      <rect width="100%" height="100%" fill="#f6f8fa"/>

      <g class="edge" data-from="outline" data-to="confirm" data-label=""><path d="M456 184 L456 248 A8 8 0 0 1 448 256 L276 256" fill="none" stroke="#17212b" stroke-width="1.2" marker-end="url(#arrow)"/></g>

      <rect x="508" y="452" width="104" height="16" rx="2" fill="#f6f8fa"/><text x="560" y="464" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">說過頭：只退該頁</text>
      <rect x="604" y="616" width="32" height="16" rx="2" fill="#f6f8fa"/><text x="620" y="628" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">通過</text>
      <rect x="658" y="704" width="116" height="16" rx="2" fill="#f6f8fa"/><text x="716" y="716" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">版面問題：只改樣板</text>
      <rect x="506" y="744" width="92" height="16" rx="2" fill="#f6f8fa"/><text x="552" y="756" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">字太多：退該頁</text>
      <rect x="484" y="808" width="32" height="16" rx="2" fill="#f6f8fa"/><text x="500" y="820" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">通過</text>
      <rect x="164" y="572" width="80" height="16" rx="2" fill="#f6f8fa"/><text x="204" y="584" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">單頁文字要改</text>
      <rect x="72" y="592" width="56" height="16" rx="2" fill="#f6f8fa"/><text x="100" y="604" text-anchor="middle" fill="#4d5a67" font-size="12" font-weight="500">結構要改</text>

      <g class="node" data-id="final"><rect x="108" y="752" width="168" height="64" rx="6" fill="#f6f8fa"/><rect x="108" y="752" width="168" height="64" rx="6" fill="#e9eef2" stroke="#4d5a67" stroke-width="1"/><text x="192" y="790" text-anchor="middle" fill="#17212b" font-size="16" font-weight="600"><tspan font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" fill="#4d5a67">8</tspan><tspan dx="6">最後確認</tspan></text></g>

      <line x1="40" y1="972" x2="968" y2="972" stroke="#cdd6de" stroke-width="0.8"/>
      <line x1="40" y1="996" x2="76" y2="996" stroke="#17212b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="264" y="988" width="24" height="16" rx="3" fill="#ffffff" stroke="#17212b"/>
      <text x="296" y="1000" fill="#4d5a67" font-size="12" font-weight="500">做出內容</text>
      <rect x="368" y="988" width="24" height="16" rx="3" fill="#e9eef2" stroke="#4d5a67"/>
